<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Speak English Together</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --primary:#2563EB; --primary-light:#60A5FA; --primary-bg:#EFF6FF;
    --bg:#F1F5F9; --card:#FFFFFF; --text:#1E293B; --text-2:#64748B;
    --line:#E2E8F0; --green:#16A34A; --amber:#D97706; --purple:#7C3AED; --danger:#DC2626;
    --radius:16px; --shadow:0 2px 10px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Baloo 2",-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);max-width:480px;margin:0 auto}
  .view{display:none;min-height:100vh;padding-bottom:30px}
  .view.active{display:block}
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:12px 16px}
  .topbar .back{background:var(--primary-bg);border:none;color:var(--primary);border-radius:10px;
    padding:7px 12px;font-size:14px;font-weight:800;cursor:pointer}
  .topbar .title{font-weight:800;font-size:15px}
  .topbar .spacer{margin-left:auto}
  .tb-ava{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;
    background:var(--primary-light);color:#fff;font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;
    box-shadow:0 2px 6px rgba(37,99,235,.3)}
  .tb-ava:empty{display:none}
  .tb-ava img{width:100%;height:100%;object-fit:cover}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;
    padding:11px 18px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-ghost{background:var(--primary-bg);color:var(--primary);border:none;border-radius:12px;
    padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer}

  /* ---------- View1 Onboarding ---------- */
  .onboard{padding:26px 22px;text-align:center}
  .logo{width:74px;height:74px;margin:6px auto 12px}
  .app-name{font-size:22px;font-weight:900;color:var(--primary)}
  .app-sub{font-size:12px;color:var(--text-2);margin-top:4px}
  .field{text-align:left;margin-top:18px}
  .field label{font-size:13px;font-weight:800;color:var(--text-2);display:block;margin-bottom:7px}
  .ipt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;
    outline:none;background:#fff}
  .ipt:focus{border-color:var(--primary)}
  .avatar-row{display:flex;align-items:center;gap:14px}
  .avatar-box{width:62px;height:62px;border-radius:50%;border:2px dashed var(--line);overflow:hidden;
    cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--primary-bg);color:var(--primary);font-size:11px}
  .avatar-box img{width:100%;height:100%;object-fit:cover}
  .avatar-hint{font-size:12px;color:var(--text-2)}
  .bands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .band{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:13px 6px;
    text-align:center;cursor:pointer;transition:.15s}
  .band .e{font-size:24px;min-height:40px;display:flex;align-items:center;justify-content:center}
  .band .e img{width:40px;height:40px;object-fit:contain}
  .band .n{font-size:13px;font-weight:800;margin-top:3px}
  .band .d{font-size:10px;color:var(--text-2);margin-top:3px;line-height:1.3}
  .band.sel{border-color:var(--primary);background:var(--primary-bg);box-shadow:var(--shadow)}

  /* ---------- View2 Chat / 聊天确定场景 ---------- */
  #viewChat{display:none;flex-direction:column;height:100vh;padding-bottom:64px}
  #viewChat.active{display:flex}
  .chat{flex:1;overflow-y:auto;padding:16px 14px 8px;background:var(--bg)}
  .bubble{max-width:84%;padding:11px 14px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);margin-bottom:12px;word-break:break-word}
  .bubble.bot{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px}
  .bubble.me{background:var(--primary);color:#fff;border-radius:16px 16px 4px 16px;margin-left:auto}
  .greet-avatar{display:inline-block;vertical-align:middle;width:28px;height:28px;border-radius:50%;overflow:hidden;
    background:var(--primary);color:#fff;font-size:13px;font-weight:800;text-align:center;line-height:28px;margin-right:6px}
  .greet-avatar img{width:100%;height:100%;object-fit:cover}
  .bubble b{color:var(--primary)}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 4px;background:#fff;border-top:1px solid var(--line)}
  .qchip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13px;font-weight:700;cursor:pointer}
  .qchip:hover,.qchip:active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
  .chat-input{display:flex;gap:8px;padding:8px 12px 12px;background:#fff}
  .chat-input input{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
  .chat-input input:focus{border-color:var(--primary)}
  .chat-input button{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}
  .mapbox{margin:4px 0 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .map-dom{font-size:14px;font-weight:800;margin:10px 2px 4px}
  .map-cat{font-size:12px;font-weight:800;color:var(--text-2);margin:8px 2px 5px}
  .subchips{display:flex;flex-wrap:wrap;gap:8px}
  .subchip{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 12px;
    font-size:13px;font-weight:700;cursor:pointer}
  .subchip:hover{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}

  /* ---------- View3 Result ---------- */
  .res{padding:16px}
  .res-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .res-head:empty{display:none;margin:0}
  .res-meta{font-size:12px;color:var(--text-2);margin:2px 2px 10px}
  .res-meta .meta-band{background:var(--primary-bg);color:var(--primary);font-weight:800;padding:3px 10px;border-radius:20px;font-size:12px}
  .cards{display:flex;flex-direction:column;gap:10px}
  .sc{background:#fff;border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);border-left:5px solid var(--primary)}
  .sc.pr{border-left-color:var(--purple)}
  .sc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .kind{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .kind.listen{background:#E0F2FE;color:#0369A1}
  .kind.qa{background:#F3E8FF;color:var(--purple)}
  .type-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#FEF3C7;color:var(--amber)}
  .tts{margin-left:auto;background:var(--primary-bg);border:none;color:var(--primary);border-radius:10px;
    padding:6px 10px;font-size:13px;cursor:pointer;font-weight:700}
  .en{font-size:18px;font-weight:800;line-height:1.35}
  .zh{font-size:13px;color:var(--text-2);margin-top:3px}
  .ans{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px;display:none}
  .ans.show{display:block}.ans .en{font-size:16px;color:var(--green)}.ans .zh{color:var(--green)}
  .reveal{margin-top:9px;background:var(--primary-bg);border:none;color:var(--primary);border-radius:10px;
    padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .tpr{font-size:11px;color:var(--text-2);margin-top:6px;background:#F8FAFC;padding:5px 8px;border-radius:8px}
  .res-actions{display:flex;gap:10px;margin:16px 0 4px}
  .placeholder{border:2px dashed var(--line);border-radius:14px;padding:24px 16px;text-align:center;color:var(--text-2);font-size:13px;line-height:1.6}

  /* ---------- View4 Vocab（活泼版·参照 mockup_wordpage_child） ---------- */
  #viewVocab{background:radial-gradient(120% 70% at 50% -6%,#DBEAFE 0%,var(--primary-bg) 55%,var(--bg) 100%)}
  /* 顶部吉祥物 + 标题 */
  .voc-head{display:flex;align-items:center;gap:12px;padding:14px 18px 2px}
  .voc-head .mascot{width:52px;height:52px;flex:0 0 auto;animation:vocwob 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 12px rgba(37,99,235,.35))}
  .voc-head h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.3px;color:var(--text)}
  .voc-head .band-sub{font-size:12px;color:var(--primary);font-weight:800;margin-top:2px}
  /* 启发式提示条 */
  .voc-hint{margin:12px 16px 4px;background:linear-gradient(90deg,#EFF6FF,#DBEAFE);border-radius:16px;
    padding:11px 13px;font-size:13px;line-height:1.5;color:#334155;display:flex;gap:9px;align-items:center;
    box-shadow:var(--shadow)}
  .voc-hint b{color:var(--primary)}
  .voc-hint svg{flex:0 0 auto}

  .vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px 8px}
  .vc{background:#fff;border-radius:22px;padding:12px 12px 14px;text-align:center;
    box-shadow:0 10px 24px rgba(37,99,235,.13);cursor:pointer;position:relative;border:none;
    animation:vocpop .5s both}
  .vc:nth-child(2){animation-delay:.06s}.vc:nth-child(3){animation-delay:.12s}
  .vc:nth-child(4){animation-delay:.18s}.vc:nth-child(5){animation-delay:.24s}
  .vc:nth-child(6){animation-delay:.30s}.vc:nth-child(7){animation-delay:.36s}
  .vc:nth-child(8){animation-delay:.42s}
  .vc .pic{height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-size:46px}
  .vc .pic img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
  .vc .pic.p1{background:linear-gradient(135deg,#BFDBFE,#FFD9C7)}
  .vc .pic.p2{background:linear-gradient(135deg,#A5F3FC,#D6F5F4)}
  .vc .pic.p3{background:linear-gradient(135deg,#C7D2FE,#E0E8FF)}
  .vc .pic.p4{background:linear-gradient(135deg,#BAE6FD,#FFE9C7)}
  .vc .pic.p5{background:linear-gradient(135deg,#BBF7D0,#E2F8E7)}
  .vc .pic.p6{background:linear-gradient(135deg,#DDD6FE,#F3E0FF)}
  .vc .ve{font-size:20px;font-weight:900;margin-top:10px;letter-spacing:.2px}
  .vc .vz{font-size:12px;color:var(--text-2);margin-top:1px}
  .vc .play{margin:10px auto 0;width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(37,99,235,.38);
    transition:transform .12s}
  .vc .play:active{transform:scale(.88)}
  .vc .play::before{content:"";width:0;height:0;border-left:12px solid #fff;
    border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
  .vc.review::after{content:"🔄复习";position:absolute;top:-6px;right:-4px;background:var(--amber);color:#fff;
    font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;box-shadow:0 3px 8px rgba(217,119,6,.35)}
  .note{font-size:11.5px;color:var(--text-2);background:rgba(255,255,255,.7);border:1px dashed #C7D7F0;
    border-radius:12px;padding:10px 12px;margin:8px 16px 4px;line-height:1.5;text-align:center}

  @keyframes vocpop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
  @keyframes vocwob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* ---------- 底部三 Tab 导航 ---------- */
  .tabview{padding-bottom:78px}
  .bottom-nav{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
    background:#fff;border-top:1px solid var(--line);z-index:30;display:none;
    padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav .nav-item{flex:1;background:none;border:none;padding:8px 0 7px;display:flex;flex-direction:column;
    align-items:center;gap:2px;color:var(--text-2);font-size:11px;font-weight:700;cursor:pointer}
  .bottom-nav .nav-item .nav-icon{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
  .bottom-nav .nav-item.active{color:var(--primary)}
  .bottom-nav .nav-item.active .nav-icon{transform:scale(1.1)}

  /* ---------- View5 历史 ---------- */
  .history-list{padding:12px 14px}
  .history-group{margin-bottom:14px}
  .history-date{font-size:12px;font-weight:800;color:var(--text-2);margin:8px 2px 8px}
  .history-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;
    box-shadow:var(--shadow);cursor:pointer}
  .history-item-head{display:flex;align-items:center;gap:8px}
  .history-scene{font-size:15px;font-weight:800}
  .history-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;background:#E0F2FE;color:#0369A1}
  .history-badge.big{background:#F3E8FF;color:var(--purple)}
  .history-count{font-size:11px;color:var(--text-2);margin-left:auto}
  .history-detail{display:none;margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  .history-item.expanded .history-detail{display:block}
  .history-detail .en{font-size:14px;font-weight:700;margin-top:6px}
  .history-detail .zh{font-size:12px;color:var(--text-2)}
  .history-empty{text-align:center;color:var(--text-2);padding:64px 20px;font-size:14px;line-height:1.7}
  .history-empty .ic{font-size:46px;display:block;margin-bottom:8px}

  /* ---------- View6 设置 ---------- */
  .settings{padding:12px 14px}
  .settings-section{margin-bottom:18px}
  .settings-section h3{font-size:14px;font-weight:800;margin:6px 2px 8px}
  .settings-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .settings-row{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .settings-row:last-child{border-bottom:none}
  .settings-row-label{font-weight:700}
  .settings-row-value{margin-left:auto;color:var(--text-2);font-size:13px;text-align:right;max-width:62%}
  .settings-row-arrow{margin-left:8px;color:var(--text-2);font-size:18px}
  .child-card{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .child-card:last-child{border-bottom:none}
  .child-ava{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:800;overflow:hidden;font-size:16px;flex-shrink:0}
  .child-ava img{width:100%;height:100%;object-fit:cover}
  .child-info .cn{font-size:15px;font-weight:800}
  .child-info .cm{font-size:12px;color:var(--text-2);margin-top:2px}
  .set-add{margin-top:10px;width:100%;border:2px dashed var(--line);background:#fff;color:var(--primary);
    border-radius:12px;padding:11px;font-weight:800;cursor:pointer}
  .review-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .review-card-top{display:flex;align-items:center;gap:10px}
  .review-card-icon{font-size:28px;width:36px;text-align:center}
  .review-card-info{flex:1}
  .review-card-name{font-size:14px;font-weight:800}
  .review-card-meta{font-size:11px;color:var(--text-2)}
  .review-actions{display:flex;gap:8px;margin-top:10px}
  .rev-btn{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:99px;font-weight:800;cursor:pointer;border:none}
  .rev-btn.sentence{color:var(--primary);background:var(--primary-bg)}
  .rev-btn.vocab{color:var(--purple);background:#F3E8FF}

  .bands-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .band-i{background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:10px 6px;text-align:center;transition:.15s;opacity:.55}
  .band-i .e{font-size:24px;min-height:36px;display:flex;align-items:center;justify-content:center}
  .band-i .n{font-size:12px;font-weight:800;margin-top:2px}
  .band-i .d{font-size:10px;color:var(--text-2);margin-top:2px;line-height:1.3}
  .band-i.active{border-color:var(--primary);background:var(--primary-bg);opacity:1}
  .band-i.active .d{color:var(--primary)}
</style>
</head>
<body>

<!-- ===== View 1: Onboarding ===== -->
<section class="view active" id="viewOnboard">
  <div class="onboard">
    <svg class="logo" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="white" stroke="#E2E8F0" stroke-width="2"/><circle cx="60" cy="60" r="46" fill="#2563EB"/><text x="60" y="76" text-anchor="middle" font-size="56" font-weight="800" fill="white" font-family="Georgia,serif" font-style="italic">S</text><rect x="84" y="4" width="34" height="24" rx="10" fill="white" stroke="#E2E8F0" stroke-width="2"/><path d="M93 26 L96 33 L102 27 Z" fill="white" stroke="#E2E8F0" stroke-width="1.5" stroke-linejoin="round"/><text x="101" y="21" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB" font-family="-apple-system,BlinkMacSystemFont,sans-serif">Hi</text></svg>
    <div class="app-name">Speak English Together</div>
    <div class="app-sub">陪孩子，在生活中练口语</div>

    <div class="field">
      <label>孩子小名</label>
      <input class="ipt" id="childName" placeholder="例如：乐乐" maxlength="12">
    </div>
    <div class="field">
      <label>孩子年龄</label>
      <input class="ipt" id="childAge" type="number" min="0" max="10" value="6">
    </div>
    <div class="field">
      <label>头像（可选）</label>
      <div class="avatar-row">
        <div class="avatar-box" id="avatarBox" onclick="document.getElementById('avatarInput').click()">
          <span style="font-size:28px;line-height:56px;text-align:center;display:block;color:var(--primary);font-weight:300">+</span>
        </div>
        <div class="avatar-hint">点击上传宝贝头像</div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none">
      </div>
    </div>
    <div class="field">
      <label>学习阶段</label>
      <div class="bands-info" id="bandsInfo"></div>
      <div style="font-size:11px;color:var(--text-2);margin-top:7px">💡 系统根据年龄自动匹配。如不合适，可在「设置」中调整。</div>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:26px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="startApp()">开始说英语</button>
  </div>
</section>

<!-- ===== View 2: 聊天确定场景 ===== -->
<section class="view" id="viewChat">
  <div class="topbar">
    <button class="back" onclick="showView('viewOnboard')">‹</button>
    <div class="title" id="chatTitle">想聊点什么？</div>
    <div class="spacer"></div>
    <button class="btn-ghost" onclick="openMap()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/></svg> 全部场景</button>
  </div>
  <div class="chat" id="chatLog"></div>
  <div class="quick" id="quick"></div>
  <div class="chat-input">
    <input id="chatText" placeholder="也可以直接打字，比如「刷牙」「超市」" onkeydown="if(event.key==='Enter')sendText()">
    <button onclick="sendText()">发送</button>
  </div>
</section>

<!-- ===== View 3: Result ===== -->
<section class="view tabview" id="viewResult">
  <div class="topbar">
    <button class="back" onclick="showView('viewChat')">‹</button>
    <div class="title" id="resTitle">场景语句</div>
    <div class="spacer"></div>
    <div class="tb-ava" id="resAva"></div>
    <button class="btn-ghost" onclick="goVocab()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 单词学习</button>
  </div>
  <div class="res">
    <div class="res-head" id="resHead"></div>
    <div class="res-meta" id="resMeta"></div>
    <div class="cards" id="resCards"></div>
    <div class="res-actions">
      <button class="btn-ghost" style="flex:1" onclick="showView('viewChat')">↺ 换个场景</button>
    </div>

    .replace(/\blet us\b/gi,"let's").replace(/\bi am\b/gi,"I'm")
    .replace(/\byou are\b/gi,"you're").replace(/\bwe are\b/gi,"we're")
    .replace(/\bthey are\b/gi,"they're");
  var fellBack=false;
  // 云端失败：标记本次会话云端不可用（后续不再等），并立即退回浏览器语音
  function fallback(){ if(fellBack) return; fellBack=true; cloudTtsDown=true; speakLocal(text); }
  // 云端 1.5 秒还没开始播（国内连 workers.dev 慢/失败），自动退回浏览器语音
  var timer=setTimeout(fallback, 1500);
  audio.onplaying=function(){ clearTimeout(timer); };      // 云端成功播放，取消兜底
  audio.onerror=function(){ clearTimeout(timer); fallback(); };
  audio.src = TTS_WORKER_URL + '?text=' + encodeURIComponent(t) + '&voice=en-US-AriaNeural';
  audio.play().catch(function(){ clearTimeout(timer); fallback(); });  // 播放被拒也兜底
}
function speakLocal(text){
  if(!('speechSynthesis' in window)) return;
  try{
    var _t0=performance.now();
    // 修复Chrome延迟bug：仅在真正播报中才cancel；空cancel会拖慢下一次speak的启动
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    var t=text
      .replace(/_/g," ")
      .replace(/\bdon't\b/gi,"don't").replace(/\bcan not\b/gi,"can't").replace(/\bwill not\b/gi,"won't")
      .replace(/\bis not\b/gi,"isn't").replace(/\bare not\b/gi,"aren't").replace(/\bdoes not\b/gi,"doesn't")
      .replace(/\bdid not\b/gi,"didn't").replace(/\bdo not\b/gi,"don't").replace(/\bi will\b/gi,"I'll")
      .replace(/\byou will\b/gi,"you'll").replace(/\bwe will\b/gi,"we'll").replace(/\bit is\b/gi,"it's")
      .replace(/\bthat is\b/gi,"that's").replace(/\bhere is\b/gi,"here's").replace(/\bthere is\b/gi,"there's")
      .replace(/\blet us\b/gi,"let's").replace(/\bi am\b/gi,"I'm").replace(/\byou are\b/gi,"you're")
      .replace(/\bwe are\b/gi,"we're").replace(/\bthey are\b/gi,"they're").replace(/\bGive me\b/gi,"Gimme");
    var parts=t.split(/(?<=[.?!,])/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>0; });
    if(!parts.length) parts=[t];
    var idx=0, logged=false;
    function speakNext(){
      if(idx>=parts.length) return;
      var u=new SpeechSynthesisUtterance(parts[idx]);
      u.lang='en-US'; u.rate=0.82; u.pitch=1.05; u.volume=1.0;
      var voice=getBestVoice();
      if(voice) u.voice=voice;
      u.onstart=function(){ if(!logged){ logged=true;
        console.log('[TTS] 出声耗时 '+Math.round(performance.now()-_t0)+'ms · 语音='+(voice?voice.name:'默认')+' · 本地='+(voice?voice.localService:'?')); } };
      u.onend=function(){ idx++; setTimeout(speakNext,100); };
      u.onerror=function(){ idx++; speakNext(); };
      speechSynthesis.speak(u);
    }
    speakNext();
  }catch(e){}
}

function sendText(){
  const inp=document.getElementById('chatText'); const v=inp.value.trim(); if(!v){ return; }
  userSay(v); inp.value=''; clearQuick();

  /* ---- 三层漏斗模糊匹配（方案A：纯规则，零依赖，离线可用） ---- */
  const SYN = (typeof window!=="undefined" && window.SCENE_SYNONYMS) ? window.SCENE_SYNONYMS : {};
  const frag = (typeof window!=="undefined" && window.subFrags) ? window.subFrags
             : function(n){ return String(n).split(/[\/、，,]/).map(s=>s.trim()).filter(Boolean); };

  /* 展开检索词：原词 + 命中的同义词键（键按切分片段匹配，接住「吃早饭/想吃点东西」这类变体） */
  let keys=[v];
  Object.keys(SYN).forEach(k=>{
    // 键命中判定：整词双向包含，或键作为片段出现在输入中（单字/短词锚点）
    if(v.includes(k) || k.includes(v)){ keys=keys.concat(SYN[k]); }
  });
  keys=[...new Set(keys)].filter(Boolean);

  const scored={};  // subId -> {id,label,score}
  function push(id,label,score){ if(!scored[id]||scored[id].score<score) scored[id]={id,label,score}; }

  TAXONOMY.forEach(d=>d.categories.forEach(c=>c.sub.forEach(s=>{
    const subHit = keys.some(k=> frag(s.name).some(f=> f.includes(k)||k.includes(f)) );
    const catHit = keys.some(k=> c.name.includes(k)||k.includes(c.name) );
    const domHit = keys.some(k=> d.name.includes(k)||k.includes(d.name) );
    if(subHit) push(s.id, s.name+' · '+c.name, 100);
    else if(catHit) push(s.id, s.name+' · '+c.name, 60);
    else if(domHit) push(s.id, s.name+' · '+c.name, 30);
  })));

  let hits=Object.values(scored).sort((a,b)=>b.score-a.score);

  /* 级别3：单字重叠兜底（前两级全空才启用，保证「几乎不空手」） */
  if(!hits.length){
    const chars=new Set(v.split(''));
    const tmp=[];
    TAXONOMY.forEach(d=>d.categories.forEach(c=>c.sub.forEach(s=>{
      const overlap=[...new Set(s.name.split(''))].filter(ch=>chars.has(ch)).length;
      if(overlap>=1) tmp.push({id:s.id,label:s.name+' · '+c.name,score:overlap});
    })));
    hits=tmp.sort((a,b)=>b.score-a.score).slice(0,12);
  }

  if(hits.length){
    botSay('我帮你找到了这些场景，点一个就开始：');
    showQuick(hits.slice(0,12), it=>{ userSay(it.label); clearQuick(); setTimeout(()=>selectScene(it.id),220); });
  } else {
    botSay('嗯…暂时没有匹配的场景，换个说法试试？或点右上角「全部场景」慢慢挑～');
  }
}

function saveToHistory(sub, items){

  const entry={
    date: todayStr,
    scene: sub.name,

    band: state.band,

      if(it.type==='ra') return {en:it.d.en, zh:it.d.zh};
      return {en:it.d.en_p, zh:it.d.zh_p};
    })
  };
  state.history.unshift(entry);

function sampleContent(b, band){
  const ra=(b.read_aloud||[]).slice(), pr=(b.prompt_reply||[]).slice();
  shuffle(ra); shuffle(pr);
  const out=[]; const wantRA=Math.min(ra.length, pr.length?3:5);
  for(let i=0;i<wantRA;i++) out.push({type:'ra',d:ra[i]});
  const wantPR=Math.min(pr.length, 5-out.length);
  for(let i=0;i<wantPR;i++) out.push({type:'pr',d:pr[i]});
  shuffle(out); return out.slice(0,5);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---- View5b 复习 ---- */
function renderReview(){
  const list=document.getElementById('reviewList');
  const seen={};
  const scens=state.history.filter(s=>{ if(seen[s.scene]) return false; seen[s.scene]=true; return true; });
  if(!scens.length){
    list.innerHTML=`<div class="history-empty"><span class="ic">📭</span>还没有学过的场景<br>去「场景」开始第一个对话吧！</div>`;
    return;
  }
  list.innerHTML=scens.map(s=>{
    const emo=SCENE_EMOJI[s.sceneId||s.scene]||'🗂️';
    return `<div class="review-card">
    <div class="review-card-top">
      <div class="review-card-icon">${emo}</div>
      <div class="review-card-info">
        <div class="review-card-name">${s.scene}</div>
        <div class="review-card-meta">${s.band} · 学过${state.history.filter(h=>h.scene===s.scene).length}次</div>
      </div>
    </div>
    <div class="review-actions">
      <button class="rev-btn sentence" onclick="selectScene('${s.sceneId||s.scene}')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 句子复习</button>
      <button class="rev-btn vocab" onclick="state.scene='${s.sceneId||s.scene}';goVocab()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 单词复习</button>
    </div>
  </div>`});
}

/* ---- View6 设置 ---- */
function renderSettings(){
  const ch=state.child;
  document.getElementById('setChildren').innerHTML=
    `<div class="child-card">
       <div class="child-ava">${ch.avatar?`<img src="${ch.avatar}">`:(ch.name||'宝').slice(0,1)}</div>
       <div class="child-info"><div class="cn">${ch.name||'宝贝'}</div>
         <div class="cm">${ch.age} 岁 · 阶段 ${bandForAge(ch.age)}</div></div>
     </div>`;
}
document.getElementById('btnClearHistory').onclick=()=>{
  if(!state.history || !state.history.length){ alert('当前没有历史记录'); return; }
  if(confirm('确定清除所有历史记录吗？')){ state.history=[]; localStorage.removeItem(HISTORY_KEY); renderHistory(); alert('已清除历史记录'); }
};
document.getElementById('btnResetAll').onclick=()=>{
  if(confirm('将清空孩子信息、历史记录等全部数据，确定吗？')){ location.reload(); }
};
document.getElementById('btnAddChild').onclick=()=>{ alert('多孩子管理功能即将开放～'); };

/* init */
(function(){
  const _p=new URLSearchParams(location.search);
  if(_p.get('demo')){                       // 预览/截图用：?demo=1&name=豆豆 直接进第二页聊天
    const dn=_p.get('name')||'豆豆';
    state.child={name:dn,age:6,avatar:null};
    state.history=SAMPLE_HISTORY.slice();    // 演示：预置几条历史
    document.getElementById('chatTitle').textContent='想和'+dn+'聊点什么？';
    startChat(); showView('viewChat');
    const v=_p.get('view');                 // 深链：?demo=1&view=history|settings 直达某 Tab
    if(v==='review'||v==='history'||v==='settings') showView('view'+v.charAt(0).toUpperCase()+v.slice(1));
  } else {
    try{
      const saved=localStorage.getItem(HISTORY_KEY);
      if(saved) state.history=JSON.parse(saved);
    }catch(e){}
    try{
      const childSaved=localStorage.getItem(CHILD_KEY);
      if(childSaved){
        const c=JSON.parse(childSaved);
        state.child=c;
        document.getElementById('childName').value=c.name||'';
        document.getElementById('childAge').value=c.age||6;
        if(c.avatar){
          document.getElementById('avatarBox').innerHTML=`<img src="${c.avatar}">`;
        }
      }
    }catch(e){}
    renderBandsInfo();
  }
})();
